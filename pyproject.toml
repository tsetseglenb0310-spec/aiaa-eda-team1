[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aiaa-eda-team1"
version = "0.1.0"
description = "AI Academy Asia, team 1: Монголын хүн амын шилжилт хөдөлгөөний EDA хийх туслах функцууд"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["pandas", "numpy", "matplotlib", "seaborn"]

[tool.setuptools]
packages = ["aiaa_eda_team1"]
